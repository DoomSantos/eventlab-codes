<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DSR Lap Collector</title>
    <style>
      :root {
        --bg: #0a0b0d;
        --panel: #14161b;
        --text: #f2efe8;
        --muted: #a8a196;
        --accent: #e85d4c;
        --line: rgba(255, 255, 255, 0.08);
        --ok: #3ecf8e;
        --font: "Segoe UI", system-ui, sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: var(--font);
        color: var(--text);
        background:
          radial-gradient(ellipse 80% 50% at 50% -10%, rgba(232, 93, 76, 0.14), transparent 55%),
          var(--bg);
      }
      main {
        width: min(720px, calc(100% - 2rem));
        margin: 0 auto;
        padding: 2rem 0 3rem;
      }
      h1 { margin: 0 0 0.35rem; font-size: 1.5rem; }
      .sub { color: var(--muted); margin: 0 0 1.5rem; }
      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 1rem 1.1rem;
        margin-bottom: 1rem;
      }
      label {
        display: block;
        font-size: 0.8rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 0.35rem;
      }
      input, select, button {
        font: inherit;
        color: var(--text);
      }
      input, select {
        width: 100%;
        padding: 0.7rem 0.8rem;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: rgba(255,255,255,0.03);
        margin-bottom: 0.85rem;
      }
      .row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
      button {
        border: 0;
        border-radius: 10px;
        padding: 0.75rem 1rem;
        background: var(--accent);
        font-weight: 700;
        cursor: pointer;
      }
      button.secondary {
        background: transparent;
        border: 1px solid var(--line);
      }
      .actions { display: flex; gap: 0.6rem; flex-wrap: wrap; }
      .status {
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        flex-wrap: wrap;
        font-variant-numeric: tabular-nums;
      }
      .pill {
        display: inline-block;
        padding: 0.2rem 0.55rem;
        border-radius: 999px;
        border: 1px solid var(--line);
        color: var(--muted);
        font-size: 0.85rem;
      }
      .pill.live { color: var(--ok); border-color: rgba(62, 207, 142, 0.45); }
      .pending {
        border: 1px solid rgba(232, 93, 76, 0.45);
        background: rgba(232, 93, 76, 0.1);
      }
      .muted { color: var(--muted); }
      table { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
      th, td { text-align: left; padding: 0.55rem 0.25rem; border-bottom: 1px solid var(--line); }
      th { color: var(--muted); font-weight: 600; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.04em; }
      @media (max-width: 560px) { .row { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <main>
      <h1>DSR Lap Collector</h1>
      <p class="sub">Point FH6 Data Out at this PC, pick a track, drive, then save completed laps.</p>

      <section class="panel">
        <div class="row">
          <div>
            <label for="player">Display name</label>
            <input id="player" autocomplete="nickname" placeholder="Your name" />
          </div>
          <div>
            <label for="track">Track</label>
            <select id="track"></select>
          </div>
        </div>
        <div class="actions">
          <button id="save-settings" type="button">Save settings</button>
          <button id="export" class="secondary" type="button">Export to site JSON</button>
        </div>
        <p id="settings-msg" class="muted"></p>
      </section>

      <section class="panel">
        <div class="status">
          <span id="udp-state" class="pill">UDP idle</span>
          <span id="live-class" class="muted">Class/PI —</span>
          <span id="live-lap" class="muted">Lap —</span>
          <span id="packets" class="muted">0 pkt/s</span>
        </div>
      </section>

      <section id="pending-panel" class="panel pending" hidden>
        <h2 style="margin:0 0 0.5rem;font-size:1.1rem;">Lap ready</h2>
        <p id="pending-text" style="margin:0 0 0.35rem;"></p>
        <p id="pending-queue" class="muted" style="margin:0 0 0.85rem;"></p>
        <p id="pending-error" style="margin:0 0 0.75rem;color:#ff8a7a;" hidden></p>
        <div class="actions">
          <button id="accept-lap" type="button">Save lap</button>
          <button id="discard-lap" class="secondary" type="button">Discard</button>
        </div>
      </section>

      <section class="panel">
        <h2 style="margin:0 0 0.75rem;font-size:1.05rem;">Saved (this PC)</h2>
        <table>
          <thead>
            <tr>
              <th>Track</th>
              <th>Driver</th>
              <th>Time</th>
              <th>Class/PI</th>
            </tr>
          </thead>
          <tbody id="laps-body">
            <tr><td colspan="4" class="muted">No laps yet</td></tr>
          </tbody>
        </table>
      </section>
    </main>
    <script>
      const $ = (id) => document.getElementById(id);
      let pending = null;
      let pendingCount = 0;
      let hydrated = false;

      async function api(path, options) {
        const res = await fetch(path, {
          headers: { "Content-Type": "application/json" },
          ...options,
        });
        const data = await res.json();
        if (!res.ok) {
          const err = new Error(data.error || res.statusText);
          err.payload = data;
          throw err;
        }
        return data;
      }

      function currentSettings() {
        return {
          player_name: $("player").value.trim(),
          track: $("track").value,
        };
      }

      function fillTracks(tracks, selected) {
        const sel = $("track");
        const previous = sel.value || selected;
        sel.innerHTML = tracks.map((t) => `<option value="${t}">${t}</option>`).join("");
        if (previous && tracks.includes(previous)) sel.value = previous;
        else if (selected) sel.value = selected;
      }

      function renderLaps(entries) {
        const body = $("laps-body");
        if (!entries.length) {
          body.innerHTML = `<tr><td colspan="4" class="muted">No laps yet</td></tr>`;
          return;
        }
        body.innerHTML = entries
          .map(
            (e) => `<tr>
              <td>${e.track}</td>
              <td>${e.player_name}</td>
              <td>${e.lap_time}</td>
              <td>${e.class_pi}</td>
            </tr>`
          )
          .join("");
      }

      function showPending(lap, count) {
        pending = lap;
        pendingCount = count || 0;
        $("pending-panel").hidden = !lap;
        $("pending-error").hidden = true;
        $("pending-error").textContent = "";
        if (!lap) return;
        $("pending-text").textContent =
          `${lap.lap_time} · ${lap.class_pi} · car #${lap.car_ordinal}`;
        $("pending-queue").textContent =
          count > 1 ? `${count} laps waiting — saving/discarding one at a time` : "";
      }

      async function refresh() {
        const state = await api("/api/state");
        if (!hydrated) {
          if (state.player_name) $("player").value = state.player_name;
          fillTracks(state.tracks, state.track);
          hydrated = true;
        } else {
          fillTracks(state.tracks, $("track").value || state.track);
        }
        renderLaps(state.laps);
        showPending(state.pending, state.pending_count || 0);

        const live = state.live;
        const udp = $("udp-state");
        if (state.packets_per_sec > 0) {
          udp.textContent = "UDP live";
          udp.classList.add("live");
        } else {
          udp.textContent = "UDP idle — check Data Out IP/port";
          udp.classList.remove("live");
        }
        $("packets").textContent = `${state.packets_per_sec} pkt/s`;
        if (live) {
          $("live-class").textContent = live.class_pi;
          $("live-lap").textContent = `Lap ${live.lap_number} · current ${live.current_lap}`;
        } else {
          $("live-class").textContent = "Class/PI —";
          $("live-lap").textContent = "Lap —";
        }
      }

      $("save-settings").onclick = async () => {
        try {
          await api("/api/settings", {
            method: "POST",
            body: JSON.stringify(currentSettings()),
          });
          $("settings-msg").textContent = "Settings saved.";
          refresh();
        } catch (err) {
          $("settings-msg").textContent = err.message;
        }
      };

      $("accept-lap").onclick = async () => {
        try {
          const result = await api("/api/pending/accept", {
            method: "POST",
            body: JSON.stringify(currentSettings()),
          });
          $("settings-msg").textContent = result.improved
            ? `Saved new best ${result.lap_time} (${result.class_pi})`
            : `Kept existing best (this lap was not faster)`;
          await refresh();
        } catch (err) {
          $("pending-error").hidden = false;
          $("pending-error").textContent = err.message;
        }
      };

      $("discard-lap").onclick = async () => {
        try {
          await api("/api/pending/discard", { method: "POST", body: "{}" });
          await refresh();
        } catch (err) {
          $("pending-error").hidden = false;
          $("pending-error").textContent = err.message;
        }
      };

      $("export").onclick = async () => {
        try {
          const result = await api("/api/export", { method: "POST", body: "{}" });
          $("settings-msg").textContent = `Exported ${result.count} entries → ${result.path}`;
        } catch (err) {
          $("settings-msg").textContent = err.message;
        }
      };

      refresh();
      setInterval(refresh, 1000);
    </script>
  </body>
</html>
