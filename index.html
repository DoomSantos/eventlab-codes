<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="DoomSantos Racing EventLab track share codes. Tap a track, pick race type and laps, copy the code."
    />
    <title>Track Codes · DoomSantos Racing</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true"></div>

    <div class="banner-hero">
      <img
        class="banner-art"
        src="assets/brand/banner-hero.jpg"
        alt="DoomSantos Racing — wizard forging a race track"
        width="1024"
        height="319"
      />
    </div>

    <main class="page">
      <header class="hero">
        <nav class="site-nav" aria-label="Site">
          <a href="./" aria-current="page">Track Codes</a>
          <a href="./leaderboard.html">Time Attack</a>
        </nav>
        <h1 id="page-title" class="page-title-fallback">Track Codes</h1>
        <img
          class="title-art"
          src="assets/brand/title-track-codes-blend.png"
          alt="Track Codes"
          width="640"
          height="200"
        />
        <p id="page-tagline" class="tagline"></p>
        <p class="instagram-line">
          Follow
          <a id="instagram-link" href="#" target="_blank" rel="noopener noreferrer"
            >doomsantosracing</a
          >
          for new track releases.
        </p>
        <div class="how-to">
          <p class="how-to-title">How to play</p>
          <p class="how-to-steps">
            Pause Menu <span aria-hidden="true">➔</span> Creative Hub
            <span aria-hidden="true">➔</span> EventLab
            <span aria-hidden="true">➔</span> Search
            <span aria-hidden="true">➔</span> Enter Share Code
          </p>
        </div>
      </header>

      <section class="tracks" aria-label="Track codes">
        <div id="track-list" class="track-list"></div>
        <p id="load-error" class="load-error" hidden>
          Couldn’t load track data. Check that <code>data/tracks.json</code> is
          available.
        </p>
      </section>

      <footer class="footer">
        <p>Tap any code to copy it</p>
      </footer>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <script src="app.js" defer></script>
  </body>
</html>
